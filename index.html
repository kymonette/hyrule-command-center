function tileStyle(id){return db.art[id]?`background-image:url(\'${db.art[id]}\')`:``}function tileIcon(id,ic){return db.art[id]?`<img class="tile-art" src="${db.art[id]}" alt="${esc(id)} artwork">`:`<i>${ic}</i>`}function home(){let d=db.daily[today()]||{},a=occ();return `<div class="grid">${panel('DAILY SCHEDULE',(d.schedule||[]).map(x=>`<div class="stat"><span>${esc(x.time)}</span><b>${esc(x.activity)}</b></div>`).join('')||'<p class="muted">Nothing scheduled today.</p>','s6')}${panel('HABIT PROGRESS',db.habits.map(h=>`<div class="stat"><span>${esc(h.name)}</span><b>${h.done?.includes(today())?'DONE':'PENDING'}</b></div>`).join('')||'<p class="muted">No habits configured.</p>','s6')}${panel("TODAY'S STATS",`<div class="stat"><span>WATER POTIONS</span><b>${d.water||0} / ${db.prefs.waterGoal}</b></div><div class="stat"><span>COFFEE</span><b>${d.coffee||0} cups</b></div><div class="stat"><span>REST</span><b>${d.sleep||'—'} hours</b></div><div class="stat"><span>STATUS</span><b>${esc(d.mood||'—')}</b></div>`,'s6')}${panel('UPCOMING',`<p class="muted">${esc(d.reminders||'No upcoming reminders.')}</p>`,'s4')}${panel('SHEIKAH SLATE',`<p class="muted">${a.n.toFixed(1)} active occurrence points · ${a.left.toFixed(1)} remaining.</p>`,'s4')}${panel('ACHIEVEMENTS',`<p class="muted">${db.books.filter(b=>b.status==='Finished').length} books finished · ${db.habits.length} habits · ${Object.keys(db.daily).length} daily logs.</p>`,'s4')}${panel('WORK AND ATTENDANCE',`<div class="big">${a.n.toFixed(1)} / 3.0</div><div class="chart"><span style="width:${a.n/3*100}%"></span></div><div class="stat"><span>LEFT</span><b>${a.left.toFixed(1)}</b></div><div class="stat"><span>NEXT DROP</span><b>${a.a.sort((x,y)=>x.expiry.localeCompare(y.expiry))[0]?.expiry||'—'}</b></div><div class="stat"><span>TODAY</span><b>${esc(db.workDays[today()]?.status||'Not logged')}</b></div>`,'s6')}</div><div class="modulegrid">${[['daily','◎','Daily Page',(d.todo||[]).filter(t=>!t.done).length||' '],['habits','♜','Habits',`${db.habits.filter(h=>h.done?.includes(today())).length}/${db.habits.length||0}`],['reading','▤','Reading',db.books.filter(b=>b.status==='Reading').length||' '],['hobbies','✦','Hobbies',db.hobbies.length||' '],['recipes','✧','Recipes',db.recipes.length||' '],['work','⚒','Work',`${a.n.toFixed(1)}/3`],['budget','◈','Budget',' '],['stats','⌁','Stats',' ']].map(([id,ic,n,badge])=>`<button class="module" data-id="${id}" style="${db.art[id]?`background-image:url('${db.art[id]}')`:''}" onclick="go('${id}')">${badge?`<span class="tile-badge">${badge}</span>`:''}${tileIcon(id,ic)}<b>${n}</b></button>`).join('')}</div>`}function dRec(){let date=$('dailyDate')?.value||window.ccSelectedDailyDate||today();db.daily[date]??={};return db.daily[date]}function daily(){let date=$('dailyDate')?.value||window.ccSelectedDailyDate||today(),d=db.daily[date]||{};return `<div class="eyebrow">DAILY PLAN</div><div class="grid" style="margin-top:12px">${panel('HERO STATUS',`<div class="mood-cards">${[['😊','GREAT','pink'],['🙂','GOOD','cyan'],['😐','OKAY','yellow'],['😔','LOW','orange'],['😵‍💫','OVERWHELMED','purple']].map(([ic,name,color])=>`<button class="mood-card mood-${color} ${d.mood===name?'selected':''}" onclick="setD('mood','${name}')"><span class="mood-icon">${ic}</span><span class="mood-name">${name}</span></button>`).join('')}</div><p class="muted">${esc(d.mood||'How are you feeling today?')}</p>`,'s4')}${panel('TODAY'S PLAN',`<input id="dailyDate" type="date" value="${date}" onchange="window.ccSelectedDailyDate=this.value;render()"><p class="muted">${new Date(date+'T12:00:00').toLocaleDateString([],{weekday:'long'})}</p>`,'s4')}${panel('WEATHER REPORT',`<div class="weather-cards">${[['☀️','SUNNY','yellow'],['🌤️','PARTLY CLOUDY','orange'],['☁️','CLOUDY','cyan'],['🌧️','RAIN','blue'],['❄️','SNOW','purple']].map(([ic,name,color])=>`<button class="weather-card weather-${color} ${d.weather===name?'selected':''}" onclick="setD('weather','${name}')"><span>${ic}</span><small>${name}</small></button>`).join('')}</div><p class="muted">${esc(d.weather||'Select the weather')}</p>`,'s4')}${panel('DAILY REFLECTION',area('How did today go?','reflection',d.reflection||''),'s4')}${panel('REST & RECOVERY',`<div class="row">${[5,6,7,8,9,10].map(n=>`<button class="btn" onclick="setD('sleep',${n})">${n}h</button>`).join('')}</div>${field('Hours of sleep','sleep',d.sleep||'','number')}${field('Recovery status','rested',d.rested||'')}`,'s4')}${panel('SYSTEM NOTIFICATIONS',area('Reminder to…','reminders',d.reminders||''),'s4')}${panel('HEALTH POTIONS',`<div class="row between"><span class="big">${d.water||0} / ${db.prefs.waterGoal}</span><span class="muted">GLASSES</span></div><div class="potions">${Array.from({length:db.prefs.waterGoal},(_,i)=>`<button class="potion ${(d.water||0)>i?'full':''}" onclick="waterTap(${i})">🧪</button>`).join('')}</div><div class="stat"><span>COFFEE CONSUMED</span><b>${d.coffee||0} cup(s)</b></div><div class="potions">${Array.from({length:8},(_,i)=>`<button class="potion ${(d.coffee||0)>i?'full':''}" title="Coffee ${i+1}" onclick="coffeeTap(${i})">☕</button>`).join('')}</div><p class="muted">Tap a cup to set your daily coffee total. Tap an active cup to reduce it.</p>${field('Other drinks','otherDrinks',d.otherDrinks||'')}`,'s4')}${panel('ENCOUNTER SCHEDULE',`<div id="scheduleRows">${(d.schedule||[]).map(x=>`<div class="row"><input placeholder="Time" value="${esc(x.time)}"><input placeholder="Activity" value="${esc(x.activity)}"></div>`).join('')}</div><button class="btn" onclick="addSchedule()">+ Add schedule row</button>`,'s4')}${panel('QUEST LOG',`<div class="list">${(d.todo||[]).map(t=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="taskDone('${t.id}',this.checked)"><span>${esc(t.text)}</span><button class="btn danger" onclick="delTask('${t.id}')">×</button></div>`).join('')}</div><form id="taskForm" class="row"><input name="text" placeholder="Add a quest…" required><button class="btn gold">Add</button></form>`,'s4')}${panel('TRAINING',field('Workout','workout',d.workout||'')+field('Total minutes','exerciseMinutes',d.exerciseMinutes||'','number')+field('Total steps','steps',d.steps||'','number'),'s4')}${panel('GOLD LEDGER',`<div class="grid"><div class="s6">${field('Gold gained','moneyIn',d.moneyIn||'')}</div><div class="s6">${field('Source','moneyInFrom',d.moneyInFrom||'')}</div><div class="s6">${field('Gold spent','moneyOut',d.moneyOut||'')}</div><div class="s6">${field('Spent on','moneyOutFrom',d.moneyOutFrom||'')}</div></div>`,'s4')}${panel('LOOT I’M GRATEFUL FOR',area('Today I’m grateful for…','gratitude',d.gratitude||''),'s4')}${panel('RATIONS',`<div class="grid"><div class="s6">${field('Breakfast','breakfast',d.breakfast||'')}</div><div class="s6">${field('Lunch','lunch',d.lunch||'')}</div><div class="s6">${field('Dinner','dinner',d.dinner||'')}</div><div class="s6">${field('Snacks','snacks',d.snacks||'')}</div></div>`,'s4')}${panel('ADVENTURER’S NOTES',area('Notes','notes',d.notes||''),'s6')}${panel('NEXT FLOOR',area('For tomorrow','tomorrow',d.tomorrow||''),'s6')}<div class="s12 row"><button class="btn gold" onclick="saveDaily()">Save Daily Record</button><span class="muted">Records saved separately by date.</span></div></div>`}function setD(k,v){dRec()[k]=v;save();render()}function waterTap(i){let d=dRec();d.water=(d.water||0)>i?i:i+1;save();render()}function coffeeTap(i){let d=dRec();d.coffee=(d.coffee||0)>i?i:i+1;save();render()}function addSchedule(){let d=dRec();d.schedule??=[];d.schedule.push({time:'',activity:''});save();render()}function saveDaily(){let d=dRec();document.querySelectorAll('#view input[name],#view textarea[name]').forEach(x=>d[x.name]=x.value);d.schedule=[...document.querySelectorAll('#scheduleRows .row')].map(r=>({time:r.children[0].value,activity:r.children[1].value}));save();alert('Daily record saved.')}function taskDone(id,v){let t=dRec().todo.find(x=>x.id===id);if(t)t.done=v;save();render()}function delTask(id){dRec().todo=dRec().todo.filter(x=>x.id!==id);save();render()}function toggleTask(id,v){let t=db.daily[today()]?.todo?.find(x=>x.id===id);if(t)t.done=v;save();render()}
function habits(){return `<div class="eyebrow">MORDECAI · TRAINING GROUNDS</div><section class="panel s12" style="margin-top:12px"><h3>LAST 7 DAYS · TAP TO COMPLETE</h3>${db.habits.map((h,i)=>`<div class="entry row between"><b>${esc(h.name)}</b><div class="row">${Array.from({length:7},(_,j)=>{let d=new Date();d.setDate(d.getDate()-6+j);let s=dateKey(d);return `<button class="btn ${h.done?.includes(s)?'primary':''}" onclick="habitToggle(${i},'${s}')">${d.toLocaleDateString([],{weekday:'narrow'})}</button>`}).join('')}<button class="btn danger" onclick="remove('habits',${i})">×</button></div></div>`).join('')||'<p class="muted">No habits yet.</p>'}<form id="habitForm" class="row" style="margin-top:12px"><input name="name" placeholder="New habit…" required><select name="freq"><option>Daily</option><option>Weekdays</option><option>Weekly</option></select><button class="btn gold">Add habit</button></form></section>`}function habitToggle(i,s){let h=db.habits[i];h.done??=[];h.done=h.done.includes(s)?h.done.filter(x=>x!==s):[...h.done,s];save();render()}
function collection(k,kicker,title){return `<div class="eyebrow">${kicker}</div><div class="row between" style="margin:12px 0"><h2>${title}</h2><button class="btn gold" onclick="addEntry('${k}')">+ Add</button></div><div class="grid">${db[k].map((x,i)=>panel(esc(x.name),`<p>${esc(x.detail||'')}</p>${x.photo?`<img src="${x.photo}" style="max-width:100%;max-height:130px">`:''}<button class="btn danger" onclick="remove('${k}',${i})">Delete</button>`,'s4')).join('')||'<p class="muted">Nothing here yet. Add your first entry.</p>'}</div>`}function hobbies(){return collection('hobbies','DONUT · HOBBY VAULT','Hobbies')}function addEntry(k){let labels={hobbies:['Hobby / collection','Progress / notes'],books:['Book title','Author']},[a,b]=labels[k];let p=document.createElement('section');p.className='panel s12';p.innerHTML=`<h3>NEW ENTRY</h3><form id="newEntry">${field(a,'name')}${field(b,'detail')}<label>Photo (optional)</label><input type="file" name="photo" accept="image/*"><button class="btn gold">Save</button><button type="button" class="btn" onclick="render()">Cancel</button></form>`;$('view').prepend(p);$('newEntry').onsubmit=e=>{e.preventDefault();let o={name:e.target.name.value,detail:e.target.detail.value},f=e.target.photo.files[0];if(f){let r=new FileReader();r.onload=()=>{o.photo=r.result;db[k].push(o);save();render()};r.readAsDataURL(f)}else{db[k].push(o);save();render()}}}
function reading(){let year=new Date().getFullYear(),goal=+(db.prefs.readingGoal||24),finished=db.books.filter(b=>b.status==='Finished'&&(!b.finishedDate||b.finishedDate.startsWith(String(year)))).length,genres={};db.books.filter(b=>b.status==='Finished').forEach(b=>(b.genres||[b.genre||'Uncategorized']).forEach(g=>genres[g]=(genres[g]||0)+1));return `<div class="eyebrow">HYRULE LIBRARY · BOOKS & READING QUESTS</div><div class="grid" style="margin-top:12px">${panel('ANNUAL BOOK CHALLENGE · ACHIEVEMENT TRACKER',`<div class="row between"><div class="big">${finished} / ${goal}</div><span class="muted">BOOKS FINISHED · ${year}</span></div><div class="chart"><span style="width:${Math.min(100,finished/Math.max(1,goal)*100)}%"></span></div><div class="row">${field('Annual book goal','readingGoal',goal,'number')}<button class="btn gold" onclick="db.prefs.readingGoal=Math.max(1,+document.querySelector('[name=readingGoal]').value||24);save();render()">Save goal</button></div>`,'s12')}${panel('YOUR SHELVES',`<div class="row">${['Currently Reading','Want to Read','Finished','DNF'].map(x=>`<span class="tag">${x}: ${db.books.filter(b=>b.status===x).length}</span>`).join('')}</div>`,'s12')}${panel('GENRES READ',Object.entries(genres).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<div class="stat"><span>${esc(g)}</span><b>${n} books</b></div>`).join('')||'<p class="muted">Finish books and assign genres to build your genre report.</p>','s4')}${panel('LIBRARY',`<button class="btn gold" onclick="addBook()">+ Add a book</button><div class="bookgrid" style="margin-top:12px">${db.books.map((b,i)=>`<div class="bookcard">${b.photo?`<img src="${b.photo}" alt="Book cover">`:'<div style="height:175px;display:grid;place-items:center;font-size:40px">📖</div>'}<b>${esc(b.name)}</b><p class="muted">${esc(b.author||'Unknown author')}</p><span class="tag">${esc(b.status||'Want to Read')}</span><p class="muted">${esc((b.genres||[b.genre||'']).join(', '))}</p><label>Current page / total</label><div class="row"><input type="number" min="0" value="${b.pages||0}" onchange="db.books[${i}].pages=Math.max(0,+this.value);save()"><span>/</span><input type="number" min="1" value="${b.total||0}" onchange="db.books[${i}].total=Math.max(0,+this.value);save()"></div><div class="chart"><span style="width:${b.total?Math.min(100,(b.pages||0)/b.total*100):0}%"></span></div><small>${b.total?Math.round((b.pages||0)/b.total*100)+'% complete':'Add page count'}</small><label>Reading status</label><select onchange="setBookStatus(${i},this.value)">${['Want to Read','Currently Reading','Finished','DNF'].map(x=>`<option ${b.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn danger" onclick="remove('books',${i})">Remove</button></div>`).join('')||'<p class="muted">Your shelves are waiting for their first book.</p>'}</div>`,'s8')}</div>`}
function addBook(){let p=document.createElement('section');p.className='panel s12';p.innerHTML=`<h3>ADD TO LIBRARY</h3><form id="bookForm">${field('Book title','name')}${field('Author','author')}${field('Series / volume','series')}${field('Current page','pages','0','number')}${field('Total pages','total','','number')}<label>Genre(s) — separate with commas</label><input name="genres" placeholder="Fantasy, LitRPG, Horror"><label>Shelf</label><select name="status">${['Want to Read','Currently Reading','Finished','DNF'].map(x=>`<option>${x}</option>`).join('')}</select>${field('Rating (1–5)','rating','')}<label>Cover art</label><input type="file" name="photo" accept="image/*">${area('Review / notes','review')}<button class="btn gold">Add book</button></form>`;$('view').prepend(p);$('bookForm').onsubmit=e=>{e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f));o.genres=o.genres.split(',').map(x=>x.trim()).filter(Boolean);o.pages=+o.pages;o.total=+o.total;o.finishedDate=o.status==='Finished'?today():'';let file=f.photo.files[0],done=()=>{db.books.push(o);save();render()};if(file){let r=new FileReader();r.onload=()=>{o.photo=r.result;done()};r.readAsDataURL(file)}else done()}}
function setBookStatus(i,v){let b=db.books[i];b.status=v;if(v==='Finished'&&!b.finishedDate)b.finishedDate=today();if(v!=='Finished')b.finishedDate='';save();render()}
function recipes(){let tried=db.recipes.filter(r=>r.tried).length,newCount=db.recipes.filter(r=>r.type==='New').length;return `<div class="cover"><div class="eyebrow">HYRULE RECIPE ARCHIVE · RECIPES & MEALS</div><h2>THE HERO’S COOKBOOK</h2><p class="muted">Recipes worth making again.</p><button class="btn gold" onclick="addRecipe()">+ Add a Recipe</button></div><div class="grid" style="margin-top:12px">${panel('RECIPE EXPERIMENT LOG',`<div class="row between"><div><div class="big">${tried}</div><small>Recipes cooked</small></div><div><div class="big">${db.recipes.filter(r=>r.type==='New'&&r.tried).length}</div><small>New recipes tried</small></div><div><div class="big">${db.recipes.filter(r=>r.type==='Established'&&r.tried).length}</div><small>Established recipes made</small></div></div>`,'s12')}${panel('RECIPE INDEX',`<div class="row">${['All','New','Established'].map(x=>`<button class="btn" onclick="recipeFilter='${x}';render()">${x}</button>`).join('')}</div><div class="grid" style="margin-top:10px">${db.recipes.map((r,i)=>({r,i})).filter(x=>!window.recipeFilter||window.recipeFilter==='All'||(x.r.type||'Established')===window.recipeFilter).map(({r,i})=>panel(esc(r.name),`${r.photo?`<img src="${r.photo}" style="width:100%;height:120px;object-fit:cover">`:'<div style="font-size:35px">🍲</div>'}<p>${esc(r.detail||'')}</p><span class="tag">${esc(r.type||'Established')}</span><span class="tag">${esc(r.category||'Unsorted')}</span><p class="muted">${r.tried?'Cooked '+esc(r.timesMade||1)+' time(s)':'Not cooked yet'}</p><button class="btn" onclick="openRecipe(${i})">Open recipe</button>`,'s4')).join('')||'<p class="muted">No recipes in this view.</p>'}`,'s12')}</div>`}
function addRecipe(){let p=document.createElement('section');p.className='panel s12';p.innerHTML=`<h3>NEW RECIPE</h3><form id="recipeForm">${field('Recipe name','name')}${field('Description','detail')}<label>Recipe type</label><select name="type"><option>New</option><option>Established</option></select><label>Category</label><select name="category"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option><option>Dessert</option><option>Other</option></select>${field('Prep minutes','prep','','number')}${field('Cook minutes','cook','','number')}${field('Servings','servings','4','number')}${area('Ingredients (one per line)','ingredients')}${area('Instructions (one step per line)','steps')}<label>Food photo</label><input type="file" name="photo" accept="image/*"><button class="btn gold">Save recipe</button></form>`;$('view').prepend(p);$('recipeForm').onsubmit=e=>{e.preventDefault();let f=e.target,o={tried:false,timesMade:0};['name','detail','type','category','prep','cook','servings','ingredients','steps'].forEach(k=>o[k]=f[k].value);let file=f.photo.files[0];if(file){let r=new FileReader();r.onload=()=>{o.photo=r.result;db.recipes.push(o);save();render()};r.readAsDataURL(file)}else{db.recipes.push(o);save();render()}}}function markCooked(i){let r=db.recipes[i];r.tried=true;r.timesMade=(r.timesMade||0)+1;r.lastCooked=today();save();render()}function openRecipe(i){let r=db.recipes[i],p=document.createElement('section');p.className='panel s12';p.innerHTML=`<div class="paper">${r.photo?`<img src="${r.photo}" style="width:100%;max-height:200px;object-fit:cover">`:''}<div class="eyebrow">HYRULE RECIPE ARCHIVE</div><h2>${esc(r.name)}</h2><p>${esc(r.detail||'')}</p><p>PREP ${esc(r.prep||'—')} MIN · COOK ${esc(r.cook||'—')} MIN · SERVES ${esc(r.servings||'—')}</p><div class="grid"><div class="s4"><h3>INGREDIENTS</h3>${(r.ingredients||'').split('\n').map(x=>`<div class="task"><input type="checkbox">${esc(x)}</div>`).join('')}</div><div class="s8"><h3>METHOD</h3>${(r.steps||'').split('\n').map((x,j)=>`<p>${j+1}. ${esc(x)}</p>`).join('')}</div></div><h3>COOK’S NOTES</h3><div class="row"><button class="btn gold" onclick="markCooked(${i})">${r.tried?'Cooked it again':'Mark as cooked / tried'}</button><span class="muted">${r.tried?(r.timesMade||1)+' time(s) cooked':'Not yet tried'}</span></div><textarea id="recipeNotes">${esc(r.notes||'')}</textarea><button class="btn gold" onclick="db.recipes[${i}].notes=$('recipeNotes').value;save();alert('Notes saved')">Save notes</button><button class="btn" onclick="render()">Back</button></div>`;$('view').prepend(p)}
function budget(){let sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0),inc=sum(db.income),out=sum(db.expenses);return `<div class="eyebrow">LOOT & LEDGER · MONTHLY BUDGET</div><div class="grid" style="margin-top:12px">${panel('MONTHLY BALANCE',`<div class="big">$${(inc-out).toFixed(2)}</div><div class="stat"><span>INCOME</span><b>$${inc.toFixed(2)}</b></div><div class="stat"><span>SPENT</span><b>$${out.toFixed(2)}</b></div>`,'s12')}${panel('RECORD INCOME',`<form id="incomeForm">${field('Source','source')}${field('Amount','amount','','number')}${field('Date','date',today(),'date')}<button class="btn gold">Add income</button></form>`,'s6')}${panel('RECORD EXPENSE',`<form id="expenseForm">${field('Category / description','source')}${field('Amount','amount','','number')}${field('Date','date',today(),'date')}<button class="btn gold">Add expense</button></form>`,'s6')}${panel('BILLS & DUE DATES',`<form id="billForm">${field('Bill','name')}${field('Amount','amount','','number')}${field('Due date','due','','date')}<button class="btn gold">Add bill</button></form>${db.bills.map((b,i)=>`<div class="stat"><span>${esc(b.name)} · ${b.due}</span><input type="checkbox" ${b.paid?'checked':''} onchange="db.bills[${i}].paid=this.checked;save();render()">Paid</div>`).join('')}`,'s6')}${panel('TRANSACTION HISTORY',`<h3>INCOME</h3>${db.income.map(x=>`<div class="stat"><span>${x.date} · ${esc(x.source)}</span><b>$${(+x.amount).toFixed(2)}</b></div>`).join('')}<h3>EXPENSES</h3>${db.expenses.map(x=>`<div class="stat"><span>${x.date} · ${esc(x.source)}</span><b>$${(+x.amount).toFixed(2)}</b></div>`).join('')}`,'s6')}</div>`}
function work(){let a=occ(),all=[...db.occ].sort((x,y)=>x.expiry.localeCompare(y.expiry));return `<div class="eyebrow">ATTENDANCE & HOURS · WORK LEDGER</div><div class="grid" style="margin-top:12px">${panel('ROLLING OCCURRENCE ALLOWANCE',`<div class="big">${a.n.toFixed(1)} / 3.0</div><div class="chart"><span style="width:${a.n/3*100}%"></span></div><p>${a.left.toFixed(1)} remaining. Each occurrence expires 30 calendar days after its date. Expired records remain in history.</p><h3>UPCOMING EXPIRATIONS</h3>${a.a.sort((x,y)=>x.expiry.localeCompare(y.expiry)).map(o=>`<div class="stat"><b>${o.expiry}</b><span>${o.value===1?'FULL 1.0':'HALF 0.5'}</span><span>${o.date}</span></div>`).join('')||'<p class="muted">No active occurrences.</p>'}`,'s12')}${panel('ADD OCCURRENCE',`<form id="occForm">${field('Date','date',today(),'date')}<label>Type</label><select name="value"><option value="1">Full (1.0)</option><option value=".5">Half (0.5)</option></select>${field('Note','note')}<button class="btn gold">Add occurrence</button></form>`,'s4')}${panel('OCCURRENCE LEDGER',all.map((o,i)=>`<div class="entry row between"><span>${o.date}</span><b>${o.value===1?'Full 1.0':'Half 0.5'}</b><small>Expires ${o.expiry}</small><button class="btn danger" onclick="remove('occ',${i})">Delete</button></div>`).join('')||'<p class="muted">No entries yet.</p>','s8')}${panel('WORK CALENDAR',calendar(),'s12')}${panel('SELECTED WORKDAY',`<form id="workForm">${field('Date','date',workDate,'date')}<label>Status</label><select name="status">${['Worked','Sick / Call-out','Vacation / PTO','Holiday','Laid Off','Other Leave','Day Off'].map(x=>`<option>${x}</option>`).join('')}</select><div class="grid"><div class="s6">${field('Regular hours','regular','0','number')}</div><div class="s6">${field('Overtime hours','ot','0','number')}</div></div>${field('Notes','notes')}<label>Occurrence</label><select name="occ"><option value="0">None</option><option value="1">Full 1.0</option><option value=".5">Half 0.5</option></select><button class="btn gold">Save workday</button></form>`,'s6')}${panel('WORK STATISTICS',workStats(),'s6')}${panel('LAYOFF TRACKER',`<form id="layoffForm">${field('Start date','start',today(),'date')}${field('Expected return','expected','','date')}${field('Actual return','actual','','date')}${field('Notes','note')}<button class="btn gold">Save layoff</button></form>${db.layoffs.map(x=>`<div class="stat"><span>${x.start} → ${x.actual||x.expected||'Ongoing'}</span><span>${esc(x.note)}</span></div>`).join('')}`,'s12')}</div>`}function calendar(){let d=new Date(workDate+'T12:00:00'),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();return `<div class="row between"><button class="btn" onclick="moveMonth(-1)">‹</button><b>${d.toLocaleDateString([],{month:'long',year:'numeric'})}</b><button class="btn" onclick="moveMonth(1)">›</button></div><div class="daygrid" style="margin-top:8px">${['S','M','T','W','T','F','S'].map(x=>`<div class="muted">${x}</div>`).join('')}${Array.from({length:f},()=>'<div></div>').join('')}${Array.from({length:n},(_,i)=>{let s=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,w=db.workDays[s];return `<button class="day ${s===workDate?'selected':''}" onclick="workDate='${s}';render()">${i+1}${w?`<small>${w.status==='Worked'?'W':w.status==='Laid Off'?'L':w.status==='Sick / Call-out'?'S':'•'}</small>`:''}</button>`}).join('')}</div>`}function moveMonth(n){let d=new Date(workDate+'T12:00:00');d.setMonth(d.getMonth()+n);workDate=dateKey(d);render()}function workStats(){let a=Object.values(db.workDays),r=a.reduce((s,x)=>s+(+x.regular||0),0),o=a.reduce((s,x)=>s+(+x.ot||0),0);return `<div class="big">${(r+o).toFixed(1)} hrs</div><div class="stat"><span>REGULAR</span><b>${r}</b></div><div class="stat"><span>OVERTIME</span><b>${o}</b></div><div class="stat"><span>DAYS LOGGED</span><b>${a.length}</b></div><div class="stat"><span>LAYOFF PERIODS</span><b>${db.layoffs.length}</b></div>`}
function stats(){let ds=Object.values(db.daily),sum=k=>ds.reduce((s,x)=>s+(+x[k]||0),0),a=occ(),money=x=>x.reduce((s,v)=>s+(+v.amount||0),0),m={};ds.forEach(x=>{if(x.mood){let label=({'😊':'GREAT','🙂':'GOOD','😐':'OKAY','😔':'LOW','😵‍💫':'OVERWHELMED','😎':'GOOD','🙁':'LOW','☹':'LOW'})[x.mood]||x.mood;m[label]=(m[label]||0)+1}});let year=new Date().getFullYear(),finished=db.books.filter(b=>b.status==='Finished'&&(!b.finishedDate||b.finishedDate.startsWith(String(year))));let genres={};finished.forEach(b=>(b.genres||[b.genre||'Uncategorized']).forEach(g=>genres[g]=(genres[g]||0)+1));return `<div class="eyebrow">HERO’S JOURNEY · ADVENTURE RECORD · ACHIEVEMENTS</div><div class="grid" style="margin-top:12px">${[['DAILY RECORDS',ds.length],['WATER GLASSES',sum('water')],['COFFEE CUPS',sum('coffee')],['SLEEP HOURS',sum('sleep')],['EXERCISE MINUTES',sum('exerciseMinutes')],['PAGES READ',db.books.reduce((s,x)=>s+(+x.pages||0),0)],['BOOKS FINISHED THIS YEAR',finished.length],['NEW RECIPES TRIED',db.recipes.filter(r=>r.type==='New'&&r.tried).length],['TOTAL RECIPES COOKED',db.recipes.filter(r=>r.tried).reduce((s,r)=>s+(+r.timesMade||1),0)],['WORK HOURS',Object.values(db.workDays).reduce((s,x)=>s+(+x.regular||0)+(+x.ot||0),0)],['ACTIVE OCCURRENCES',a.n.toFixed(1)+'/3'],['HABITS',db.habits.length]].map(x=>panel(x[0],`<div class="big">${x[1]}</div>`,'s3')).join('')}${panel('HERO STATUS LOG · MOOD HISTORY',Object.entries(m).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<p class="muted">No mood data yet.</p>','s4')}${panel('GENRES CONQUERED · '+year,Object.entries(genres).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<p class="muted">No completed books yet.</p>','s4')}</div>`}
function settings(){return `<div class="grid">${panel('BACKUP & RESTORE',`<p>Download a JSON copy of your records and uploaded images.</p><button class="btn gold" onclick="backup()">Download backup</button><label>Restore backup</label><input type="file" id="restoreFile" accept=".json"><button class="btn" onclick="restore()">Validate & restore</button>`,'s6')}${panel('CUSTOM ARTWORK',`<label>Category</label><select id="artKey">${pages.slice(1).map(x=>`<option value="${x[0]}">${x[2]}</option>`).join('')}</select><label>Upload image</label><input type="file" id="artFile" accept="image/*"><button class="btn gold" onclick="uploadArt()">Save artwork</button><button class="btn" onclick="deleteArt()">Restore default</button>`,'s6')}${panel('WATER GOAL',`${field('Daily water goal','goal',db.prefs.waterGoal,'number')}<button class="btn gold" onclick="setGoal()">Save goal</button>`,'s6')}${panel('STORAGE NOTICE',`<p>This version stores data in this browser on this device. Cloud sync and automatic off-device backups are not enabled. Export backups regularly; clearing browser data can erase the local copy.</p>`,'s6')}</div>`}function setGoal(){db.prefs.waterGoal=Math.max(1,Math.min(30,+document.querySelector('[name=goal]').value||8));save();render()}function backup(){let b=new Blob([JSON.stringify({app:'Hyrule Command Center',version:1,data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hyrule-command-center-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function restore(){let f=$('restoreFile').files[0];if(!f)return alert('Choose a backup file');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.data?.daily||!x.data?.occ)throw Error('Not a compatible backup');if(!confirm('This replaces current local data. Continue?'))return;db={...fresh(),...x.data};save();go('home');alert('Backup restored')}catch(e){alert('Restore failed: '+e.message)}};r.readAsText(f)}function uploadArt(){let f=$('artFile').files[0];if(!f)return alert('Choose an image');let r=new FileReader();r.onload=()=>{db.art[$('artKey').value]=r.result;save();alert('Artwork saved and included in backups')};r.readAsDataURL(f)}function deleteArt(){delete db.art[$('artKey').value];save();alert('Default artwork restored')}function remove(k,i){if(!confirm('Delete this record?'))return;db[k].splice(i,1);save();render()}
function bind(){[['taskForm','todo'],['habitForm','habits'],['incomeForm','income'],['expenseForm','expenses'],['billForm','bills'],['occForm','occ'],['workForm','workDays'],['layoffForm','layoffs']].forEach(([id,k])=>{let f=$(id);if(!f)return;f.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(f));if(k==='todo'){let d=dRec();d.todo??=[];d.todo.push({id:crypto.randomUUID(),text:o.text,done:false})}else if(k==='habits')db.habits.push({name:o.name,freq:o.freq,done:[]});else if(k==='occ'){o.value=+o.value;o.expiry=plus(o.date,30);db.occ.push(o)}else if(k==='workDays'){let date=o.date,n=+o.occ;delete o.occ;db.workDays[date]=o;if(n)db.occ.push({date,value:n,expiry:plus(date,30),note:'From workday log'})}else db[k].push(o);save();render()}})}header();go('home');
</script>
